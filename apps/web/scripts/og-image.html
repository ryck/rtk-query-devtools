<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("FONT_INTER") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrainsMono";
        src: url("FONT_MONO") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        font-family: Inter, system-ui, sans-serif;
        color: #fafafa;
        overflow: hidden;
        position: relative;
      }
      /* A single warm bloom behind the board, so the composition has a focal
         point without adding decoration that competes with the text. */
      .glow {
        position: absolute;
        right: -140px;
        bottom: -220px;
        width: 760px;
        height: 620px;
        background: radial-gradient(
          circle,
          rgba(208, 135, 0, 0.14),
          transparent 62%
        );
      }
      .page {
        position: relative;
        padding: 54px 64px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .wordmark {
        font-family: JetBrainsMono, monospace;
        font-size: 23px;
        color: #a1a1a1;
        letter-spacing: 0.01em;
      }
      /* Matches the logo lockup and the site header. */
      .wordmark b {
        color: #d08700;
        font-weight: inherit;
      }
      h1 {
        margin-top: 30px;
        font-size: 55px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -0.021em;
      }
      /* Broken explicitly rather than left to wrap. The two sentences are the
         natural split, and guessing a max-width is what let it run to three
         lines and collide with the board. */
      h1 span {
        display: block;
      }
      h1 .dim {
        color: #d4d4d4;
      }
      .url {
        margin-top: 24px;
        font-family: JetBrainsMono, monospace;
        font-size: 21px;
        color: #d08700;
      }
      .board {
        /* Bottom-anchored so the slack sits under the headline as breathing
           room, rather than as a dead band beneath the card. */
        margin-top: auto;
        border: 1px solid #262626;
        border-radius: 16px;
        background: #171717;
        overflow: hidden;
      }
      .board-head {
        display: flex;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid #262626;
        font-family: JetBrainsMono, monospace;
        font-size: 14px;
        letter-spacing: 0.18em;
        color: #a1a1a1;
      }
      .live {
        color: #34d399;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #34d399;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 20px;
        font-family: JetBrainsMono, monospace;
        font-size: 21px;
      }
      .row + .row {
        border-top: 1px solid #262626;
      }
      .endpoint {
        flex: 1;
      }
      .badge {
        font-size: 14px;
        letter-spacing: 0.08em;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .fresh {
        background: rgba(52, 211, 153, 0.14);
        color: #34d399;
      }
      .error {
        background: rgba(251, 113, 102, 0.14);
        color: #fb7166;
      }
      .subs {
        color: #a1a1a1;
        font-size: 17px;
        width: 62px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="page">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
          <rect x="6" y="6" width="22" height="22" rx="4" fill="#fafafa" />
          <rect
            x="36"
            y="6"
            width="22"
            height="22"
            rx="4"
            fill="#fafafa"
            opacity="0.25"
          />
          <rect
            x="6"
            y="36"
            width="22"
            height="22"
            rx="4"
            fill="#fafafa"
            opacity="0.25"
          />
          <rect x="36" y="36" width="22" height="22" rx="4" fill="#d08700" />
        </svg>
        <span class="wordmark">rtk-query-<b>devtools</b></span>
      </div>

      <h1>
        <span>RTK Query has a cache.</span>
        <span class="dim">Now you can actually see it.</span>
      </h1>

      <div class="board">
        <div class="board-head">
          <span>LIVE STATUS</span>
          <span class="live"><span class="dot"></span>LIVE</span>
        </div>
        <div class="row">
          <span class="endpoint"
            >getPost<span style="color: #a1a1a1">(1)</span></span
          >
          <span class="badge fresh">FRESH</span>
          <span class="subs">1 sub</span>
        </div>
        <div class="row">
          <span class="endpoint"
            >listPosts<span style="color: #a1a1a1">()</span></span
          >
          <span class="badge fresh">FRESH</span>
          <span class="subs">2 subs</span>
        </div>
        <div class="row">
          <span class="endpoint"
            >listPostsFlaky<span style="color: #a1a1a1">()</span></span
          >
          <span class="badge error">ERROR</span>
          <span class="subs">1 sub</span>
        </div>
      </div>

      <div class="url">rtk-query-devtools.ryck.dev</div>
    </div>
  </body>
</html>
